<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web K clipboard interaction-TTL PoC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font: 16px system-ui; margin: 2rem; }
  button { font: inherit; padding: .7rem 1rem; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<h1>Clipboard interaction-TTL PoC</h1>
<p id="status">Automatic read scheduled for 12 seconds after page load.</p>
<button id="grant" type="button">Grant clipboard permission with this interaction</button>
<pre id="result">No callback yet.</pre>
<script>
  const status = document.querySelector('#status');
  const result = document.querySelector('#result');

  function requestClipboard(label) {
    Telegram.WebApp.readTextFromClipboard((text) => {
      result.textContent = `${label}: ${text === null || text === undefined ? '[no data]' : text}`;
    });
  }

  document.querySelector('#grant').addEventListener('click', () => {
    requestClipboard('interactive request');
  });

  setTimeout(() => {
    status.textContent = 'Automatic interaction-free request sent after 12 seconds.';
    requestClipboard('automatic request');
  }, 12000);

  Telegram.WebApp.ready();
</script>
